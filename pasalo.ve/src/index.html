<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <title>Pásalo | Cobra pago móvil y gestiona tu negocio en Venezuela</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pásalo es la plataforma venezolana para vender y cobrar: gestiona pedidos, recibe pagos por pago móvil o transferencia en bolívares o dólares, y verifica cada comprobante desde un solo lugar.">
  <meta name="theme-color" content="#045fde">
  <link rel="icon" type="image/png" href="pasalo-iso.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pásalo">
</head>
<body class="nb-theme-default">
  <!--
    Aplica el tema guardado antes de que el navegador pinte el dashboard: si se
    esperara a que Angular arranque, cada recarga mostraria un parpadeo blanco.
    Va solo para /dashboard porque la web publica siempre se ve en claro, y la
    clase que pone aca es la misma que despues maneja ThemeService/Nebular.
  -->
  <script>
    (function () {
      try {
        if (location.pathname.indexOf('/dashboard') === 0 && localStorage.getItem('pasalo-theme') === 'dark') {
          document.body.classList.remove('nb-theme-default');
          document.body.classList.add('nb-theme-dark');
        }
      } catch (e) {
        // localStorage bloqueado (modo privado, cookies de terceros): se queda en claro
      }
    })();
  </script>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
