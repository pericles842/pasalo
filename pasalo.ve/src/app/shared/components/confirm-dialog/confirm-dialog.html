<nb-card class="m-0 w-[min(90vw,26rem)]">
  <nb-card-header class="flex items-center gap-2">
    <nb-icon [icon]="status === 'danger' || status === 'warning' ? 'alert-triangle-outline' : 'checkmark-circle-2-outline'"
      [status]="status"></nb-icon>
    <span>{{ title }}</span>
  </nb-card-header>

  <nb-card-body>
    <p class="m-0 text-sm text-gray-600">{{ message }}</p>
  </nb-card-body>

  <nb-card-footer class="flex justify-end gap-2">
    <button nbButton status="basic" appearance="outline" type="button" (click)="cancel()">
      {{ cancelLabel }}
    </button>
    <button nbButton [status]="status" type="button" (click)="confirm()">
      {{ confirmLabel }}
    </button>
  </nb-card-footer>
</nb-card>
