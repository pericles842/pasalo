@if (plan) {
<div class="transition-transform duration-150 hover:-translate-y-1 h-full"
  [ngClass]="{'ring-2 ring-blue-500 rounded-lg': isSelected}">
  <nb-card>
    <nb-card-header [style.background-color]="isSelected ? '#2b7fff' : plan.color_theme">
      <div class="relative pr-8">
        <span class="font-bold text-base">{{ plan.name }}</span>
        @if (plan.id == 1) {
        <nb-badge text="Gratis" status="success" position="top right"></nb-badge>
        }
      </div>
    </nb-card-header>

    <nb-card-body>
      <div class="flex items-baseline gap-1 mb-3">
        @if (plan.id == 1) {
        <span class="text-4xl font-bold">$0</span>
        } @else {
        <span class="text-4xl font-bold">${{ plan.price }}</span>
        <span class="text-sm text-gray-400">/mes</span>
        }
      </div>
      <p class="text-sm text-gray-400 m-0 leading-relaxed">{{ plan.description}}</p>
    </nb-card-body>

    <nb-card-footer>
      <button nbButton fullWidth [status]="isSelected ? 'primary' : 'basic'" (click)="planSelected.emit()">
        {{ isSelected ? 'Seleccionado ✓' : 'Seleccionar' }}
      </button>
    </nb-card-footer>
  </nb-card>
</div>
}
