<header class="flex items-center justify-between gap-4  px-4 py-3 text-white shadow-blue-900/15">
  <div class="space-y-1">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
      <h1 class="text-base font-semibold">{{ auth.session()?.company?.name ?? 'Pásalo' }}</h1>
    </div>
  </div>

  <div class="flex items-center gap-3 rounded-2xl bg-blue/12 px-3 py-2.5">

    <div class="leading-tight flex flex-col items-end">
      <p class="text-sm font-semibold">{{ auth.full_name() }}</p>
      <p class="text-xs text-blue-100">{{ auth.session()?.role?.name }}</p>
    </div>

    <span class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-sm font-semibold text-blue-700">
      {{ auth.initials() }}
    </span>

    <span class="hidden h-8 w-px bg-white/20 sm:block"></span>

    <button nbButton size="small" status="basic" (click)="logout()">
      Salir
    </button>
  </div>
</header>
