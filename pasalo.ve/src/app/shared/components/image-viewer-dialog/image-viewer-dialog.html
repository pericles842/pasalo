<div class="flex h-[85vh] w-[92vw] max-w-4xl flex-col overflow-hidden rounded-xl bg-slate-900 shadow-2xl">
  <div class="flex items-center justify-between gap-2 border-b border-white/10 px-4 py-3">
    <span class="text-sm font-medium text-white">Comprobante de pago</span>

    <div class="flex items-center gap-1">
      <button nbButton size="small" appearance="ghost" status="basic" class="text-white!" type="button"
        [disabled]="!canZoomOut" (click)="zoomOut()" title="Alejar" aria-label="Alejar">
        <nb-icon icon="minus-outline"></nb-icon>
      </button>
      <button nbButton size="small" appearance="ghost" status="basic" class="text-white!" type="button"
        [disabled]="!canZoomIn" (click)="zoomIn()" title="Acercar" aria-label="Acercar">
        <nb-icon icon="plus-outline"></nb-icon>
      </button>
      <button nbButton size="small" appearance="ghost" status="basic" class="text-white!" type="button"
        (click)="rotate()" title="Girar" aria-label="Girar">
        <nb-icon icon="corner-up-right-outline"></nb-icon>
      </button>
      <button nbButton size="small" appearance="ghost" status="basic" class="text-white!" type="button"
        (click)="reset()" title="Restablecer" aria-label="Restablecer">
        <nb-icon icon="refresh-outline"></nb-icon>
      </button>
      <span class="mx-1 h-6 w-px bg-white/20"></span>
      <button nbButton size="small" appearance="ghost" status="basic" class="text-white!" type="button"
        (click)="close()" title="Cerrar" aria-label="Cerrar">
        <nb-icon icon="close-outline"></nb-icon>
      </button>
    </div>
  </div>

  <div class="flex flex-1 items-center justify-center overflow-hidden select-none" (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)" [style.cursor]="scale > 1 ? 'grab' : 'default'">
    <img [src]="src" [alt]="alt" class="max-h-full max-w-full object-contain transition-transform duration-100"
      [style.transform]="transform" draggable="false" />
  </div>

  <div class="border-t border-white/10 px-4 py-2 text-center text-xs text-white/50">
    Rueda del mouse o los botones para acercar · arrastra la imagen para moverla
  </div>
</div>
