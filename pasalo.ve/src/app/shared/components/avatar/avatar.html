@if (photoUrl) {
<img [src]="photoUrl" alt="" class="{{ sizeClass }} {{ shapeClass }} {{ fitClass }} aspect-square shrink-0" />
} @else {
<span class="{{ sizeClass }} {{ bubbleClass }} {{ shapeClass }} flex aspect-square shrink-0 items-center justify-center font-semibold">
  {{ initialsText }}
</span>
}
