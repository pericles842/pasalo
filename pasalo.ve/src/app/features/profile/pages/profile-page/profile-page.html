<section class="flex flex-col gap-6">
  <div class="flex flex-col gap-4">
    <span class="text-lg font-semibold text-slate-900">Mi perfil</span>

    <form [formGroup]="form" (submit)="$event.preventDefault(); save()" class="flex flex-col gap-6">

      <div class="flex w-fit items-center gap-4" data-tour="profile-photo">
        <label class="group relative cursor-pointer">
          <app-avatar [photoUrl]="photo_preview() ?? auth.session()?.user?.photo_url ?? null"
            [initialsText]="auth.initials()" sizeClass="h-20 w-20 text-2xl"></app-avatar>
          <span
            class="absolute inset-0 flex items-center justify-center rounded-full bg-black/0 text-xs font-semibold text-transparent transition-colors group-hover:bg-black/40 group-hover:text-white">
            Cambiar
          </span>
          <input type="file" accept="image/*" class="hidden" (change)="onPhotoSelected($event)" />
        </label>

        <div class="flex flex-col">
          <span class="text-sm font-semibold text-slate-900">Foto de perfil</span>
          <span class="text-xs text-gray-500">Opcional. Si no subes una, se muestran tus iniciales.</span>
        </div>
      </div>

      <section class="grid grid-cols-12 gap-4">
        <app-global-input class="col-span-12 md:col-span-6" name="first_name" label="Nombre"
          [control]="form.controls.first_name" placeholder="Ej. Ana" error="El nombre es requerido" />

        <app-global-input class="col-span-12 md:col-span-6" name="middle_name" label="Apellido"
          [control]="form.controls.middle_name" placeholder="Ej. Pérez" />
      </section>

      <section class="flex flex-col gap-4 border-t border-blue-100 pt-5">
        <span class="text-sm font-semibold text-slate-900">Cambiar contraseña</span>
        <p class="-mt-2 text-xs text-gray-500">Opcional. Déjalo en blanco si no quieres cambiarla.</p>

        <section class="grid grid-cols-12 gap-4">
          <app-global-input class="col-span-12" name="current_password" label="Contraseña actual" type="password"
            [control]="form.controls.current_password" placeholder="********" />

          <app-global-input class="col-span-12 md:col-span-6" name="new_password" label="Nueva contraseña"
            type="password" [control]="form.controls.new_password" placeholder="********"
            hint="Mínimo 8 caracteres" error="Mínimo 8 caracteres" />

          <app-global-input class="col-span-12 md:col-span-6" name="new_password_confirmation"
            label="Confirmar nueva contraseña" type="password"
            [control]="form.controls.new_password_confirmation" placeholder="********"
            error="Las contraseñas no coinciden" />
        </section>
      </section>

      <button nbButton status="primary" fullWidth type="submit" [disabled]="is_saving()">
        {{ is_saving() ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </div>
</section>
