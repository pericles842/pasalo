<form [formGroup]="form" class="mt-5 flex flex-col gap-5">
  <section class="grid grid-cols-12 gap-4">
    <app-global-input class="col-span-12 md:col-span-4" name="name" label="Nombre de la empresa"
      [control]="form.controls.name" placeholder="Ej. Empresa S.A." />

    <app-global-input class="col-span-12 md:col-span-4" name="rif" label="RIF"
      [control]="form.controls.rif" placeholder="Ej. J-1234567897" />

    <app-global-input class="col-span-12 md:col-span-4" name="domain" label="Dominio"
      [control]="form.controls.domain" placeholder="empresa.com" />

    <app-global-input class="col-span-12 md:col-span-2" name="user_limits"
      label="Límite de usuarios" [control]="form.controls.user_limits" placeholder="Ej. 5" type="number" />
  </section>
</form>
