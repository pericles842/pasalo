<section class="flex min-h-screen flex-col bg-gradient-to-b from-blue-100 via-white via-40% to-pink-50">
  <div class="flex flex-1 items-stretch">
    <div class="flex flex-1 items-center justify-center px-4 py-10">
    <nb-card class="w-full max-w-md border-white/60! bg-white/70! shadow-xl! backdrop-blur-xl">
      <nb-card-header>
        <div class="flex flex-col items-center gap-3 pb-1 text-center">
          <img src="/pasalo-logo.png" alt="Pásalo" class="h-20 w-auto" />
          <div class="flex flex-col gap-1">
            <span class="text-2xl font-bold">Inicia sesión</span>
            <span class="text-sm text-gray-500">Entra al panel de tu empresa en Pásalo.</span>
          </div>
        </div>
      </nb-card-header>

      <nb-card-body>
        <div class="flex justify-center" #googleButton></div>

        <div class="my-5 flex items-center gap-3">
          <span class="h-px flex-1 bg-gray-200"></span>
          <span class="text-xs text-gray-400">o con tu correo</span>
          <span class="h-px flex-1 bg-gray-200"></span>
        </div>

        <form [formGroup]="login_form" (ngSubmit)="submit()" class="flex flex-col gap-5">
          <app-global-input name="login_email" label="Correo" type="email" [control]="login_form.controls.email"
            placeholder="tucorreo@gmail.com" error="Ingresa un correo válido" />

          <app-global-input name="login_password" label="Contraseña" type="password"
            [control]="login_form.controls.password" placeholder="********" error="La contraseña es requerida" />

          <button nbButton status="primary" fullWidth type="submit" [disabled]="is_saving">
            {{ is_saving ? 'Entrando...' : 'Entrar' }}
          </button>
        </form>
      </nb-card-body>

      <nb-card-footer>
        <p class="m-0 text-center text-sm text-gray-500">
          ¿Aún no tienes empresa registrada?
          <a routerLink="/create-company" class="font-semibold text-blue-600">Regístrala aquí</a>
        </p>
      </nb-card-footer>
    </nb-card>
    </div>
  </div>

  <app-copyright variant="subtle"></app-copyright>
</section>
