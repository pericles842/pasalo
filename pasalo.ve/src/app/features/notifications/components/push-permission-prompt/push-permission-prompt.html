@if (visible()) {
<div class="flex flex-col gap-2 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
  <p class="m-0 flex items-center gap-2 text-sm text-blue-800">
    <nb-icon icon="bell-outline" [options]="{ width: 18, height: 18 }"></nb-icon>
    <span><strong>Activa las notificaciones</strong> para enterarte al instante cuando recibas un pago, aunque tengas la app cerrada.</span>
  </p>
  <div class="flex shrink-0 items-center gap-2 self-start sm:self-auto">
    <button nbButton size="small" appearance="ghost" status="basic" type="button" (click)="dismiss()">
      Ahora no
    </button>
    <button nbButton size="small" status="primary" type="button" [disabled]="is_subscribing()" (click)="enable()">
      Activar
    </button>
  </div>
</div>
}
