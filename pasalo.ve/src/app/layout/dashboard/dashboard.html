<section class="flex min-h-screen flex-col bg-gradient-to-b from-blue-100 via-white via-40% to-pink-50">
  <app-header-dashboard (menuToggle)="toggleMenu()"></app-header-dashboard>

  <section class="grid flex-1 grid-cols-1 content-start gap-2 px-3 pb-3 sm:px-6 sm:pb-4 lg:px-8 lg:pb-6">
    <app-subscription-status-banner></app-subscription-status-banner>

    <section class="grid grid-cols-1 gap-6 lg:grid-cols-[280px_minmax(0,1fr)] lg:items-start">

      <!-- Fondo oscuro al abrir el menu en modo telefono -->
      @if (is_menu_open()) {
      <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="closeMenu()"></div>
      }

      <div class="grid gap-4">
        <aside
          class="fixed inset-y-0 left-0 z-40 w-72 max-w-[85vw] overflow-y-auto bg-white p-6 shadow-lg lg:static lg:z-auto lg:block lg:w-auto lg:max-w-none lg:rounded lg:border lg:border-blue-100 lg:p-6 lg:shadow-sm lg:shadow-blue-900/5"
          [class.hidden]="!is_menu_open()">
        <div class="grid content-start gap-6">
          <div class="flex flex-col items-center gap-2 border-b border-blue-100 pb-4 text-center">
            <span class="flex h-10 w-28 items-center justify-center">
              <img src="/pasalo-logo.png" alt="Pásalo" class="h-full w-full object-contain opacity-80" />
            </span>
            <p class="text-xs font-semibold uppercase tracking-[0.24em] text-blue-500">Navegacion</p>
          </div>

          <nav class="grid gap-1" (click)="closeMenu()">
            <a routerLink="list" routerLinkActive #rlaList="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaList.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="list-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Ordenes</span>
              @if (paid_orders_count() > 0) {
              <span class="grid h-5 min-w-5 place-items-center rounded-full bg-amber-500 px-1.5 text-xs font-semibold text-white!">
                {{ paid_orders_count() }}
              </span>
              }
            </a>

            <a routerLink="form" routerLinkActive #rlaForm="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaForm.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="plus-circle-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Crear Orden</span>
            </a>

            <a routerLink="profile" routerLinkActive #rlaProfile="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaProfile.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="person-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Perfil</span>
            </a>

            @if (is_admin()) {
            <a routerLink="stats" routerLinkActive #rlaStats="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaStats.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="bar-chart-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Estadísticas</span>
            </a>

            <a routerLink="company" routerLinkActive #rlaCompany="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaCompany.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="briefcase-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Empresa</span>
            </a>

            <a routerLink="users" routerLinkActive #rlaUsers="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaUsers.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="people-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Usuarios</span>
            </a>

            <a routerLink="payment-methods" routerLinkActive #rlaPayments="routerLinkActive" ariaCurrentWhenActive="page"
              [class]="rlaPayments.isActive ? NAV_LINK_ACTIVE_CLASS : NAV_LINK_CLASS">
              <nb-icon icon="credit-card-outline" [options]="{ width: 20, height: 20 }"></nb-icon>
              <span class="flex-1">Métodos de pago</span>
            </a>
            }
          </nav>
        </div>
      </aside>

        <div class="hidden min-h-[220px] sm:min-h-[280px] lg:block">
          <app-ad-slot placement="footer-menu-dashboard"></app-ad-slot>
        </div>
      </div>

      <main class="min-w-0 rounded-xl border border-blue-100 bg-white p-4 shadow-sm shadow-blue-900/5 sm:p-6">
        <router-outlet></router-outlet>
      </main>
    </section>
  </section>

  <app-copyright variant="light"></app-copyright>
</section>
