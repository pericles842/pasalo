<section class="min-h-screen bg-blue-50 px-3 py-3 sm:px-6 sm:py-4 lg:px-8 lg:py-6">
  <section class="grid grid-cols-1 gap-2">
    <app-header-dashboard (menuToggle)="toggleMenu()"></app-header-dashboard>

    <section class="grid grid-cols-1 gap-6 lg:grid-cols-[280px_minmax(0,1fr)] lg:items-start">

      <!-- Fondo oscuro al abrir el menu en modo telefono -->
      @if (is_menu_open()) {
      <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="closeMenu()"></div>
      }

      <aside
        class="fixed inset-y-0 left-0 z-40 w-72 max-w-[85vw] overflow-y-auto bg-white p-6 shadow-lg lg:static lg:z-auto lg:block lg:w-auto lg:max-w-none lg:rounded lg:border lg:border-blue-100 lg:p-6 lg:shadow-sm lg:shadow-blue-900/5"
        [class.hidden]="!is_menu_open()">
        <div class="grid content-start gap-6">
          <div class="space-y-1 border-b border-blue-100 pb-4">
            <p class="text-xs font-semibold uppercase tracking-[0.24em] text-blue-500">Navegacion</p>
            <h2 class="text-xl font-semibold text-slate-900">pasalo.ve</h2>
          </div>

          <nav class="grid gap-3" (click)="closeMenu()">
            <button nbButton [status]="'primary'" [appearance]="'outline'" routerLink="list"
              routerLinkActive="appearance=solid" ariaCurrentWhenActive="page">
              Ordenes
            </button>

            <button nbButton [status]="'primary'" [appearance]="'outline'" routerLink="form"
              routerLinkActive="appearance=solid" ariaCurrentWhenActive="page">
              Crear Orden
            </button>

            @if (is_admin()) {
            <button nbButton [status]="'primary'" [appearance]="'outline'" routerLink="users"
              routerLinkActive="appearance=solid" ariaCurrentWhenActive="page">
              Usuarios
            </button>

            <button nbButton [status]="'primary'" [appearance]="'outline'" routerLink="payment-methods"
              routerLinkActive="appearance=solid" ariaCurrentWhenActive="page">
              Métodos de pago
            </button>
            }
          </nav>
        </div>
      </aside>

      <main class="min-w-0 rounded-xl border border-blue-100 bg-white p-4 shadow-sm shadow-blue-900/5 sm:p-6">
        <router-outlet></router-outlet>
      </main>
    </section>
  </section>

</section>
