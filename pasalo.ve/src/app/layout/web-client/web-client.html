<div class="flex min-h-screen flex-col">
  <header class="site-header">
    <a routerLink="/" fragment="inicio" class="brand" aria-label="Pásalo, inicio">
      <img src="/pasalo-logo.png" alt="Pásalo" class="brand-logo" />
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menu_open()"
      aria-label="Abrir menú">
      {{ menu_open() ? 'Cerrar' : 'Menú' }}
    </button>

    <nav class="main-nav" [class.open]="menu_open()" aria-label="Navegación principal">
      <a routerLink="/" fragment="beneficios">Beneficios</a>
      <a routerLink="/" fragment="como-funciona">Cómo funciona</a>
      <a routerLink="/" fragment="precios">Precios</a>
      <a routerLink="/" fragment="nosotros">Quiénes somos</a>
      <a routerLink="/" fragment="contacto">Contacto</a>

      @if (is_logged_in()) {
      <button nbButton size="small" status="success" type="button" routerLink="/dashboard">Ir al dashboard</button>
      } @else {
      <a class="nav-login" routerLink="/login">Iniciar sesión</a>
      <button nbButton size="small" status="success" type="button" routerLink="/login">Registrar empresa</button>
      }
    </nav>
  </header>

  <div class="web-client-layout">
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
  <app-copyright></app-copyright>
</div>
